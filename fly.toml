# Fly.io config for the Sleuth case service. One machine, one SQLite volume (the queue is single-process by design).
app = "sleuth-cases"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  SLEUTH_HOST = "0.0.0.0"
  SLEUTH_PORT = "8080"
  SLEUTH_HOME = "/data"
  SLEUTH_TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # the worker loop must keep running for queued investigations and monitoring
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "sleuth_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
